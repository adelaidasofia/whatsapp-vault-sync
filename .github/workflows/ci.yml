name: ci
# Cross-platform gate: the sync must install and its unit tests must pass on
# Windows, macOS, and Linux (Mycelium cross-platform rule, MYC-3033).
# Complements the auto-managed test.yml (do not fold into it — that file is
# owned by gh-harden-repos.sh and gets rewritten).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Unit tests
        run: npm test
      - name: Entry point exits 1 with the per-OS help text when no vault is given
        shell: bash
        run: |
          set +e
          out=$(node sync.mjs 2>&1)
          code=$?
          set -e
          echo "$out"
          test $code -eq 1
          echo "$out" | grep -q 'PowerShell'
