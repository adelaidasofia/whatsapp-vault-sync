name: security-audit
# Auto-managed by ~/.local/bin/gh-harden-repos.sh. Do not hand-edit.
#
# Blocks CI on known dependency advisories so a vulnerable package
# cannot land unnoticed (the failure mode behind Dependabot alerts
# sitting in a dashboard nobody reads). The weekly run catches
# advisories newly disclosed against already-pinned deps, where no
# commit is needed for the repo to become vulnerable.
#
# npm: threshold is `high`, so high and critical fail the build while
# moderate and low stay with Dependabot PRs and the gate is signal,
# not noise.
# pip: a genuinely unfixable advisory can be waived with
# `--ignore-vuln <GHSA-id>` and a justifying comment, never by deleting
# this gate.
#
# No untrusted input is interpolated into any run: step.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 13 * * 1'   # Mondays 13:00 UTC
  workflow_dispatch:

concurrency:
  # A superseded push to the same PR cancels the in-flight run instead of
  # billing it to completion. Scoped to pull_request ONLY: push / schedule runs
  # are never cancelled (and if a merge queue is ever wired here, cancelling a
  # queued group would deadlock it). Added by MYC-3180; moved into the
  # generator by MYC-3412 so regeneration stops silently reverting it.
  group: security-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
      - name: npm audit (block on high + critical, honour explicit waivers)
        run: |
          if [ ! -f package-lock.json ] && [ ! -f npm-shrinkwrap.json ]; then
            npm install --package-lock-only --ignore-scripts
          fi
          # A genuinely unfixable advisory is waived BY ID in
          # .github/npm-audit-waivers.txt with a justifying comment -- never by
          # deleting this gate and never by lowering --audit-level. Same
          # contract the pip lane gets from `pip-audit --ignore-vuln <GHSA-id>`;
          # npm audit has no native equivalent, so the waiver is applied here.
          npm audit --json > /tmp/npm-audit.json 2>/dev/null || true
          # Unparseable output is NOT green. A gate that cannot read its own
          # result must fail closed, or "audit did not run" reads as "audit clean".
          if ! jq -e 'type == "object"' /tmp/npm-audit.json >/dev/null 2>&1; then
            echo "::error::npm audit produced no parseable JSON -- refusing to report green"
            exit 1
          fi
          jq -r '
            (.vulnerabilities // {}) | to_entries[] | .value
            | select(.severity == "high" or .severity == "critical")
            | .via[]? | select(type == "object") | .url // empty
          ' /tmp/npm-audit.json | sed 's#.*/##' | sort -u > /tmp/npm-audit-found.txt
          : > /tmp/npm-audit-waived.txt
          if [ -f .github/npm-audit-waivers.txt ]; then
            sed -e 's/#.*//' -e 's/[[:space:]]//g' .github/npm-audit-waivers.txt \
              | grep -v '^$' | sort -u > /tmp/npm-audit-waived.txt
          fi
          unwaived=$(comm -23 /tmp/npm-audit-found.txt /tmp/npm-audit-waived.txt)
          if [ -n "$unwaived" ]; then
            echo "::error::Unwaived high/critical npm advisories present:"
            printf '  %s\n' $unwaived
            echo "--- full report ---"
            npm audit --audit-level=high || true
            exit 1
          fi
          if [ -s /tmp/npm-audit-waived.txt ]; then
            echo "npm audit: clean apart from explicitly waived advisories:"
            sed 's/^/  /' /tmp/npm-audit-waived.txt
          else
            echo "npm audit: no high or critical advisories."
          fi