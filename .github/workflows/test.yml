name: test
# Auto-managed by ~/.local/bin/gh-harden-repos.sh. Do not hand-edit.
# Smoke-test for Node repos without npm test. Validates package.json +
# dependency install. When the repo grows a test script, this is replaced
# by render_minimal_node_workflow().
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci || npm install
      - name: Validate package.json
        run: node -e "JSON.parse(require('fs').readFileSync('package.json'))"