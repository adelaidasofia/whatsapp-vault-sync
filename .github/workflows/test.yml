name: test
# Auto-managed by ~/.local/bin/gh-harden-repos.sh. Do not hand-edit.
# Minimal CI gate for Node repos. Allows Layer 5
# dependabot-auto-merge to wait on a real check.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
concurrency:
  # A superseded push to the same PR cancels the in-flight run instead of
  # billing it to completion. Scoped to pull_request ONLY: push / schedule runs
  # are never cancelled (and if a merge queue is ever wired here, cancelling a
  # queued group would deadlock it). Added by MYC-3180; moved into the
  # generator by MYC-3412 so regeneration stops silently reverting it.
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: npm
      # npm ci ONLY -- no `|| npm install` fallback. npm ci fails exactly when
      # package-lock.json and package.json disagree; falling back to npm install
      # then re-resolves and CI goes green having tested a DIFFERENT dependency
      # tree than the one committed, which silently defeats security pins added
      # via `overrides`. Fail loud instead: a desynced lockfile is a real defect.
      # A repo with no lockfile is handled by the explicit branch below.
      - name: Install dependencies (lockfile is authoritative)
        run: |
          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            npm ci
          else
            echo "::warning::No lockfile committed; resolving fresh. Commit package-lock.json so CI tests the pinned tree."
            npm install
          fi
      - run: npm test --if-present